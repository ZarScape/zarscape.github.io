<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | ZarScape</title>
    <meta name="theme-color" content="#01080e">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-1: #02060a;
            --bg-2: #07131a;
            --line: rgba(255,255,255,0.08);
            --cyan: #22d3ee;
            --cyan-soft: rgba(34,211,238,0.14);
            --text: rgba(255,255,255,0.96);
            --muted: rgba(206,250,254,0.56);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 50%, rgba(34,211,238,0.18), transparent 26%),
                radial-gradient(circle at 18% 20%, rgba(34,211,238,0.12), transparent 24%),
                radial-gradient(circle at 82% 18%, rgba(8,145,178,0.12), transparent 22%),
                linear-gradient(180deg, #041018 0%, var(--bg-1) 100%);
        }

        .shell {
            width: min(92vw, 860px);
            padding: 2rem;
        }

        .card {
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            box-shadow: 0 24px 90px rgba(0,0,0,0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 3rem;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -20% auto auto -10%;
            width: 260px;
            height: 260px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(34,211,238,0.18), transparent 70%);
            pointer-events: none;
        }

        .eyebrow {
            margin: 0 0 1rem;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(34,211,238,0.9);
        }

        h1 {
            margin: 0;
            font-size: clamp(3.6rem, 10vw, 7rem);
            line-height: 0.9;
            font-weight: 900;
        }

        .accent {
            background: linear-gradient(90deg, #99f6ff, #22d3ee, #0891b2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin: 1.5rem 0 0;
            max-width: 38rem;
            font-size: clamp(1rem, 2.2vw, 1.15rem);
            line-height: 1.75;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            padding: 0.95rem 1.4rem;
            border-radius: 999px;
            border: 1px solid rgba(103,232,249,0.18);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease, background 220ms ease;
        }

        .button-primary {
            color: #041018;
            background: linear-gradient(180deg, #67e8f9, #22d3ee);
            box-shadow: 0 14px 32px rgba(34,211,238,0.24);
        }

        .button-secondary {
            color: rgba(236,254,255,0.92);
            background: rgba(255,255,255,0.04);
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary:hover {
            box-shadow: 0 20px 38px rgba(34,211,238,0.28);
        }

        .button-secondary:hover {
            border-color: rgba(103,232,249,0.3);
            background: rgba(255,255,255,0.07);
        }

        @media (max-width: 640px) {
            .shell { padding: 1rem; }
            .card { padding: 2rem; border-radius: 1.6rem; }
            .actions { flex-direction: column; }
            .button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card">
            <p class="eyebrow">Page Missing</p>
            <h1>404<br><span class="accent">Lost In Transit</span></h1>
            <p>The page you requested does not exist or may have been moved. Head back to the portfolio and continue from the main route.</p>
            <div class="actions">
                <a class="button button-primary" href="./">Back Home</a>
            </div>
        </section>
    </main>
</body>
</html>
